<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tabela SIGTAP · Sistema IS</title>
    <meta
      name="description"
      content="Consulta moderna à Tabela de Procedimentos, Medicamentos, Órteses, Próteses e Materiais Especiais do SUS (SIGTAP), com dados públicos do DATASUS."
    />
    <meta name="theme-color" content="#0b6e69" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png" />
    <link rel="apple-touch-icon" href="assets/img/favicon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/app.css" />
    <script>
      try {
        const t = localStorage.getItem('sigtap.theme');
        if (t) document.documentElement.dataset.theme = JSON.parse(t);
      } catch {}
    </script>
  </head>
  <body>
    <a class="skip" href="#main">Pular para o conteúdo</a>
    <div class="shell">
      <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
        <a class="brand" href="#/">
          <img class="brand-logo" src="assets/img/sistema-is.webp" alt="Sistema IS — Inteligência em Saúde" width="947" height="311" />
          <span class="brand-text"><strong>Tabela SIGTAP</strong><small>Plataforma de consulta a tabela unificada SUS</small></span>
        </a>
        <nav id="nav"></nav>
        <div class="sidebar-foot" id="sidebar-foot"></div>
      </aside>
      <div class="scrim" id="scrim"></div>
      <div class="main-col">
        <header class="topbar">
          <button class="icon-btn only-mobile" id="menu-btn" aria-label="Abrir menu"></button>
          <div class="top-search" id="top-search">
            <span class="st-icon"></span>
            <input id="top-q" type="search" placeholder="Buscar procedimento, código, CID, CBO…" autocomplete="off"
              role="combobox" aria-label="Buscar" aria-autocomplete="list" aria-expanded="false" aria-controls="top-results" />
            <kbd>Ctrl K</kbd>
            <div class="top-results" id="top-results" role="listbox" hidden></div>
          </div>
          <button class="btn adv-btn" id="adv-btn" title="Pesquisa avançada">
            <span class="adv-icon"></span><span>Pesquisa avançada</span>
          </button>
          <div class="topbar-actions">
            <label class="comp-select" title="Competência">
              <span>Competência</span>
              <select id="comp-select" aria-label="Competência"></select>
            </label>
            <button class="icon-btn" id="theme-btn" aria-label="Alternar tema"></button>
          </div>
        </header>
        <main id="main" tabindex="-1">
          <div class="loading-screen">
            <div class="spinner"></div>
            <p>Carregando Tabela Unificada…</p>
          </div>
        </main>
        <footer class="footer">
          <p>
            Consulta não oficial baseada em dados públicos do Ministério da Saúde / DATASUS (SIGTAP). Verifique sempre a
            fonte oficial antes de faturar.
          </p>
        </footer>
      </div>
    </div>
    <div class="palette" id="palette" hidden>
      <div class="palette-box" role="dialog" aria-modal="true" aria-label="Pesquisa avançada">
        <div class="palette-input">
          <span class="pi-icon"></span>
          <input id="palette-input" type="search" placeholder="Digite um código, nome, CID ou CBO…" autocomplete="off" />
          <kbd>Esc</kbd>
        </div>
        <div class="palette-results" id="palette-results" role="listbox"></div>
        <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> navegar</span><span><kbd>Enter</kbd> abrir</span><span><kbd>Esc</kbd> fechar</span></div>
      </div>
    </div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
