[project]
name = "clinical-rag-agent"
version = "0.1.0"
description = "Microserviço de agente RAG de apoio clínico (perfil retrospectivo + copiloto em tempo real)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
